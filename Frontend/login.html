<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - CookFlow</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="cabecera">
    <a class="logo" href="index.html">🍳 CookFlow</a>
    <nav id="nav"></nav>
  </header>

  <main class="contenedor">
    <form id="form" class="formulario">
      <h1>Iniciar sesión</h1>

      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="email">

      <label for="password">Contraseña</label>
      <input id="password" type="password" required autocomplete="current-password">

      <p id="mensaje" class="mensaje error"></p>
      <button class="btn" type="submit">Entrar</button>

      <p class="alterno">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
