<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis listas - CookFlow</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="cabecera">
    <a class="logo" href="index.html">🍳 CookFlow</a>
    <nav id="nav"></nav>
  </header>

  <main class="contenedor">
    <h1>Mis listas de la compra</h1>

    <form id="form-nueva" class="nueva-lista">
      <input id="nombre" type="text" maxlength="100" placeholder="Nombre (ej. Cena del viernes)">
      <label for="pax">Personas</label>
      <input id="pax" type="number" min="1" max="50" value="2" required>
      <button class="btn" type="submit">Crear lista</button>
    </form>

    <p id="estado" class="estado"></p>
    <ul id="listas" class="listas"></ul>
  </main>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/listas.js"></script>
</body>
</html>
